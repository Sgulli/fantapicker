services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fantapicker
      POSTGRES_PASSWORD: fantapicker
      POSTGRES_DB: fantapicker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantapicker -d fantapicker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
